          },
          {
            "@type": "FAQPage",
            "@id": "https://stratafin.org/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How do creator fees end up on my card?",
                "acceptedAnswer": { "@type": "Answer", "text": "StrataPay watches the wallet that receives your pump.fun creator fees. When fees arrive, you can sweep them to your card balance automatically or move them yourself. Every sweep shows up in your activity feed next to the trades it came from, so you always know where the money started." }
              },
              {
                "@type": "Question",
                "name": "Do I need to be the coin's creator?",
                "acceptedAnswer": { "@type": "Answer", "text": "No. Anyone can get a card funded from their own wallet. To route a coin's creator fees to the card, connect the wallet that launched it on pump.fun. You can link a coin later, too." }
              },
              {
                "@type": "Question",
                "name": "Can I give cards to my team?",
                "acceptedAnswer": { "@type": "Answer", "text": "On the Creator card you can issue extra cards, set a limit on each one and pause any of them whenever you like." }
              },
              {
                "@type": "Question",
                "name": "Which coins work with StrataPay?",
                "acceptedAnswer": { "@type": "Answer", "text": "Any coin launched on pump.fun where you hold the creator wallet. If you run more than one coin, choose which ones feed the card." }
              },
              {
                "@type": "Question",
                "name": "Where can I spend?",
                "acceptedAnswer": { "@type": "Answer", "text": "Anywhere that takes card payments online, and in person once you add the card to your phone or carry the physical card." }
              },
              {
                "@type": "Question",
                "name": "What does it cost?",
                "acceptedAnswer": { "@type": "Answer", "text": "Starter has a one-time $10 card fee and a flat 2% each time fees convert. Creator has no conversion fee. Neither card has a monthly charge." }
              },
              {
                "@type": "Question",
                "name": "Is StrataPay part of pump.fun?",
                "acceptedAnswer": { "@type": "Answer", "text": "No. StrataPay is an independent project built on pump.fun. It is not run by, affiliated with or endorsed by pump.fun." }
              },
              {
                "@type": "Question",
                "name": "What happens if I lose my card?",
                "acceptedAnswer": { "@type": "Answer", "text": "Freeze it from the dashboard in one tap. Your fee balance stays where it is, and you can order a replacement." }
              }
            ]
          }
